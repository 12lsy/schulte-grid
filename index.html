<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全能专注力训练系统 - 终极万无一失版</title>
    <style>
        /* CSS 样式定义 */
        :root {
            --primary: #2196F3;
            --success: #4CAF50;
            --warning: #FF9800;
            --danger: #F44336;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #333333;
            --text-light: #777777;
            --border: #e0e0e0;
        }
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background: var(--primary);
            color: #fff;
            width: 100%;
            padding: 15px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .main-container {
            width: 100%;
            max-width: 800px;
            padding: 15px;
            flex: 1;
        }
        .section-card {
            background: var(--card);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .btn:active { opacity: 0.8; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
        .grid-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .grid-buttons .btn {
            height: 80px;
            font-size: 1.1rem;
            font-weight: bold;
            flex-direction: column;
            gap: 8px;
        }
        .grid-buttons .btn span.icon { font-size: 1.5rem; }
        
        /* 游戏面板 */
        .game-panel { display: none; text-align: center; }
        .game-panel.active { display: block; }
        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .game-target {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 8px;
            color: var(--primary);
        }
        .game-grid {
            display: grid;
            gap: 10px;
            margin: 0 auto;
            max-width: 500px;
        }
        .grid-cell {
            aspect-ratio: 1;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        .grid-cell:active { transform: scale(0.95); }
        
        /* 纯净化点击：点击正确时不改变颜色 */
        .grid-cell.correct {
            /* 保持原样，不改变背景色和文字颜色，全部点完才结算 */
            border-color: #ccc;
        }
        .grid-cell.error {
            background-color: #ffebee !important;
            color: var(--danger) !important;
            animation: shake 0.4s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 闪忆方格样式 */
        .flash-cell.active { background-color: var(--primary); border-color: var(--primary); }
        .flash-cell.selected { background-color: var(--success); border-color: var(--success); }
        
        /* 统计与等级 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: var(--text-light); }
        
        .level-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }
        .level-progress {
            background: var(--warning);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .modal-title { font-size: 1.5rem; margin-bottom: 15px; color: var(--primary); }
        .modal-body { margin-bottom: 20px; font-size: 1.1rem; }
        .gold-effect { color: #FFD700; text-shadow: 0 0 5px rgba(255,215,0,0.5); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* 备份区域 */
        .backup-area { margin-top: 15px; }
        .backup-text {
            width: 100%;
            height: 100px;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
        }
        #qrcode-container { margin: 15px auto; display: flex; justify-content: center; }

        /* 隐藏类 */
        .hidden { display: none !important; }
    </style>
    <!-- 引入二维码生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="header">全能专注力训练系统</div>

    <div class="main-container">
        <!-- 首页：模式选择 -->
        <div id="home-view" class="section-card">
            <div class="section-title">
                <span>选择训练模式</span>
                <button class="btn btn-outline" onclick="showStats()">我的统计</button>
            </div>
            <div class="grid-buttons">
                <button class="btn" onclick="startGame('schulte')"><span class="icon">🔢</span>数字舒尔特</button>
                <button class="btn" onclick="startGame('hanzi')"><span class="icon">🈴</span>汉字舒尔特</button>
                <button class="btn" onclick="startGame('color-interfere')"><span class="icon">🎨</span>色彩干扰</button>
                <button class="btn" onclick="startGame('flash')"><span class="icon">⚡</span>闪忆方格</button>
                <button class="btn" onclick="startGame('color-word')"><span class="icon">👁️</span>色彩识字</button>
                <button class="btn" onclick="startGame('number-mem')"><span class="icon">🧠</span>数字记忆</button>
            </div>
            
            <div style="margin-top: 20px;">
                <div class="section-title">系统工具</div>
                <div class="grid-buttons">
                    <button class="btn btn-outline" onclick="showBackup()">备份/恢复</button>
                    <button class="btn btn-outline" onclick="showRanking()">个人排行榜</button>
                </div>
            </div>
        </div>

        <!-- 游戏进行界面 -->
        <div id="game-view" class="section-card game-panel">
            <div class="section-title">
                <button class="btn btn-outline" onclick="quitGame()">退出</button>
                <span id="game-mode-title">模式</span>
                <span id="game-timer">0.0s</span>
            </div>
            
            <div id="target-display" class="game-target hidden">目标：<span id="target-text"></span></div>
            
            <div id="game-grid-container" class="game-grid"></div>
            
            <div style="margin-top: 20px; color: var(--text-light); font-size: 0.9rem;">
                进度: <span id="progress-text">0/0</span>
            </div>
        </div>

        <!-- 统计界面 -->
        <div id="stats-view" class="section-card hidden">
            <div class="section-title">
                <button class="btn btn-outline" onclick="showHome()">返回</button>
                <span>我的数据</span>
            </div>
            
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="font-size: 1.2rem; font-weight: bold;">当前等级: <span id="user-level" style="color: var(--primary); font-size: 1.5rem;">1</span></div>
                <div class="level-bar"><div class="level-progress" id="xp-bar"></div></div>
                <div style="font-size: 0.8rem; color: var(--text-light); margin-top: 5px;"><span id="current-xp">0</span> / <span id="next-level-xp">100</span> XP</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="stat-total-games">0</div>
                    <div class="stat-label">总训练次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-total-time">0</div>
                    <div class="stat-label">总时长(分)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-streak">0</div>
                    <div class="stat-label">连续打卡(天)</div>
                </div>
            </div>

            <div class="backup-area">
                <div class="section-title">日历打卡</div>
                <div id="calendar-grid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center;"></div>
            </div>
        </div>

        <!-- 备份/恢复界面 -->
        <div id="backup-view" class="section-card hidden">
            <div class="section-title">
                <button class="btn btn-outline" onclick="showHome()">返回</button>
                <span>备份与恢复</span>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="btn" onclick="exportJSON()">导出 JSON 文件</button>
                <label class="btn btn-outline" style="flex: 1; cursor: pointer;">
                    导入 JSON 文件
                    <input type="file" id="file-input" accept=".json" style="display: none;" onchange="importJSON(this)">
                </label>
            </div>
            <button class="btn btn-success" onclick="generateShareLink()" style="width: 100%; margin-bottom: 10px;">生成分享链接/二维码</button>
            <textarea id="backup-textarea" class="backup-text" placeholder="在此处粘贴恢复文本..."></textarea>
            <button class="btn" onclick="importTextData()" style="width: 100%;">从文本恢复</button>
            <div id="qrcode-container"></div>
        </div>

        <!-- 排行榜界面 -->
        <div id="ranking-view" class="section-card hidden">
            <div class="section-title">
                <button class="btn btn-outline" onclick="showHome()">返回</button>
                <span>个人最佳排行榜</span>
            </div>
            <div id="ranking-list" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- 游戏结算弹窗 -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">训练完成！</div>
            <div class="modal-body" id="result-message"></div>
            <button class="btn" onclick="closeModal()">确定</button>
        </div>
    </div>

    <script>
        // ================= 1. 数据存储与状态管理 =================
        const DB_KEY = 'focus_training_data_v2';
        let appData = {
            user: { level: 1, xp: 0, totalGames: 0, totalTime: 0, streak: 0, lastLogin: null, calendar: {} },
            records: {
                'schulte': [], 'hanzi': [], 'color-interfere': [],
                'flash': [], 'color-word': [], 'number-mem': []
            }
        };

        // 游戏运行时状态
        let gameState = {
            mode: null,
            level: 3, // 初始 3x3
            gridSize: 9,
            timer: 0,
            timerInterval: null,
            isPlaying: false,
            currentTarget: null,
            foundCount: 0,
            totalToFind: 0,
            usedItems: new Set(), // 记录已经找过的目标，防止重复
            availableItems: [], // 当前关卡可用的所有项（数字/颜色/字）
            gridItems: [], // 盘面上的项
            sequence: [], // 舒尔特/识字 的正确点击顺序
            flashSequence: [] // 闪忆的正确位置序列
        };

        // 语音合成引擎
        const synth = window.speechSynthesis;
        let isVoiceReady = false;

        // ================= 2. 初始化与本地存储 =================
        function loadData() {
            const saved = localStorage.getItem(DB_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = { ...appData, ...parsed };
                    // 兼容旧数据结构
                    if (!appData.user.calendar) appData.user.calendar = {};
                } catch (e) { console.error("数据加载失败", e); }
            }
            checkStreak();
        }

        function saveData() {
            localStorage.setItem(DB_KEY, JSON.stringify(appData));
        }

        function checkStreak() {
            const today = new Date().toDateString();
            if (appData.user.lastLogin !== today) {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (appData.user.lastLogin === yesterday.toDateString()) {
                    appData.user.streak++;
                } else if (appData.user.lastLogin !== today) {
                    appData.user.streak = 1;
                }
                appData.user.lastLogin = today;
                appData.user.calendar[today] = true;
                saveData();
            }
        }

        // 语音唤醒：解决 Git Pages 无法自动发声的问题
        function initVoice() {
            if (!isVoiceReady) {
                const utter = new SpeechSynthesisUtterance('');
                utter.volume = 0;
                synth.speak(utter);
                isVoiceReady = true;
            }
        }

        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-CN';
            utter.rate = 1.0;
            synth.speak(utter);
        }

        // ================= 3. 核心工具函数 =================
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getContrastColor(hexColor) {
            // 简单的亮度判断，用于决定文字颜色
            const r = parseInt(hexColor.substr(1, 2), 16);
            const g = parseInt(hexColor.substr(3, 2), 16);
            const b = parseInt(hexColor.substr(5, 2), 16);
            const brightness = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return brightness > 128 ? '#000000' : '#FFFFFF';
        }

        // ================= 4. 界面切换 =================
        function hideAllViews() {
            document.querySelectorAll('.main-container > .section-card').forEach(el => el.classList.add('hidden'));
            document.getElementById('game-view').classList.remove('active');
        }

        function showHome() {
            hideAllViews();
            document.getElementById('home-view').classList.remove('hidden');
        }

        function showStats() {
            hideAllViews();
            document.getElementById('stats-view').classList.remove('hidden');
            updateStatsUI();
        }

        function showBackup() {
            hideAllViews();
            document.getElementById('backup-view').classList.remove('hidden');
            document.getElementById('qrcode-container').innerHTML = '';
            document.getElementById('backup-textarea').value = '';
        }

        function showRanking() {
            hideAllViews();
            document.getElementById('ranking-view').classList.remove('hidden');
            updateRankingUI();
        }

        function updateStatsUI() {
            document.getElementById('user-level').innerText = appData.user.level;
            const nextXp = appData.user.level * 100;
            const currentXp = appData.user.xp;
            document.getElementById('current-xp').innerText = currentXp;
            document.getElementById('next-level-xp').innerText = nextXp;
            document.getElementById('xp-bar').style.width = `${(currentXp / nextXp) * 100}%`;
            
            document.getElementById('stat-total-games').innerText = appData.user.totalGames;
            document.getElementById('stat-total-time').innerText = Math.floor(appData.user.totalTime / 60);
            document.getElementById('stat-streak').innerText = appData.user.streak;

            // 渲染日历
            const calGrid = document.getElementById('calendar-grid');
            calGrid.innerHTML = '';
            const today = new Date();
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dateStr = d.toDateString();
                const dayDiv = document.createElement('div');
                dayDiv.style.padding = '5px';
                dayDiv.style.borderRadius = '5px';
                dayDiv.style.background = appData.user.calendar[dateStr] ? 'var(--success)' : '#eee';
                dayDiv.style.color = appData.user.calendar[dateStr] ? '#fff' : '#999';
                dayDiv.innerText = `${d.getMonth() + 1}/${d.getDate()}`;
                calGrid.appendChild(dayDiv);
            }
        }

        // ================= 5. 游戏启动与逻辑分发 =================
        function startGame(mode) {
            initVoice(); // 唤醒语音
            hideAllViews();
            document.getElementById('game-view').classList.add('active');
            
            gameState.mode = mode;
            gameState.level = 3; // 默认从 3x3 开始
            gameState.foundCount = 0;
            gameState.usedItems.clear();
            
            document.getElementById('game-mode-title').innerText = getModeName(mode);
            document.getElementById('progress-text').innerText = '0/0';
            document.getElementById('target-display').classList.add('hidden');
            
            startLevel();
        }

        function getModeName(mode) {
            const names = {
                'schulte': '数字舒尔特',
                'hanzi': '汉字舒尔特',
                'color-interfere': '色彩干扰',
                'flash': '闪忆方格',
                'color-word': '色彩识字',
                'number-mem': '数字记忆'
            };
            return names[mode] || mode;
        }

        function startLevel() {
            clearInterval(gameState.timerInterval);
            gameState.timer = 0;
            gameState.isPlaying = false;
            document.getElementById('game-timer').innerText = '0.0s';
            
            const gridSize = gameState.level * gameState.level;
            gameState.gridSize = gridSize;
            const container = document.getElementById('game-grid-container');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${gameState.level}, 1fr)`;
            
            // 根据模式初始化
            switch(gameState.mode) {
                case 'schulte': initSchulte(); break;
                case 'hanzi': initHanzi(); break;
                case 'color-interfere': initColorInterfere(); break;
                case 'flash': initFlash(); break;
                case 'color-word': initColorWord(); break;
                case 'number-mem': initNumberMem(); break;
            }
        }

        function startTimer() {
            if (gameState.isPlaying) return;
            gameState.isPlaying = true;
            gameState.timerInterval = setInterval(() => {
                gameState.timer += 0.1;
                document.getElementById('game-timer').innerText = gameState.timer.toFixed(1) + 's';
            }, 100);
        }

        // ================= 6. 各种模式的具体实现 =================

        // 6.1 数字舒尔特 & 6.2 汉字舒尔特 (逻辑相同，素材不同)
        function initSchulte() {
            const total = gameState.gridSize;
            gameState.totalToFind = total;
            gameState.sequence = Array.from({length: total}, (_, i) => i + 1);
            shuffle(gameState.sequence);
            
            gameState.sequence.forEach(num => {
                const cell = createCell(num.toString(), () => onSchulteClick(num, cell));
                document.getElementById('game-grid-container').appendChild(cell);
            });
            updateProgress();
        }

        function initHanzi() {
            const hz = "的一是在不了有和人这中大为上个国我以要他时来用们生到作地于出就分对成会可主发年动同工也能下过子说产种面而方后多定行学法所民得经十三之进着等部度家电力里如水化高自二理起小物现实加量都两体制机当使点从业本去把性好应开它合还因由其些然前外天政四日那社义事平形相全表间样与关各重新线内数正心反你明看原又么利比或但质气第向道命此变条只没结解问意建月公无系军很情者最立代想已通并提直题党程展五果料象员革位入常文总次品式活设及管特件长求老头基资边流路级少图山统接知较将组见计别她手角期根论运农指几九区强放决西被干做必战先回则任取完举科术话共六";
            const total = gameState.gridSize;
            let chars = [];
            // 确保不重复
            while(chars.length < total) {
                const c = hz[Math.floor(Math.random() * hz.length)];
                if(!chars.includes(c)) chars.push(c);
            }
            gameState.sequence = [...chars];
            shuffle(gameState.sequence);
            
            gameState.sequence.forEach(char => {
                const cell = createCell(char, () => onSchulteClick(char, cell));
                document.getElementById('game-grid-container').appendChild(cell);
            });
            updateProgress();
        }

        function onSchulteClick(val, cellEl) {
            if (!gameState.isPlaying) startTimer();
            if (val === gameState.sequence[gameState.foundCount]) {
                gameState.foundCount++;
                // 【核心修改】：点击正确后，方块不改变颜色，全部点完才结算
                // 仅添加 correct 类，不修改背景色和文字色
                cellEl.classList.add('correct'); 
                speak(val.toString());
                updateProgress();
                
                if (gameState.foundCount === gameState.totalToFind) {
                    finishGame();
                }
            } else {
                cellEl.classList.add('error');
                setTimeout(() => cellEl.classList.remove('error'), 400);
            }
        }

        // 6.3 色彩干扰 (找颜色)
        function initColorInterfere() {
            const colors = [
                {name: '红', code: '#F44336'}, {name: '绿', code: '#4CAF50'},
                {name: '蓝', code: '#2196F3'}, {name: '黄', code: '#FFEB3B'},
                {name: '紫', code: '#9C27B0'}, {name: '橙', code: '#FF9800'},
                {name: '青', code: '#00BCD4'}, {name: '粉', code: '#E91E63'},
                {name: '棕', code: '#795548'}, {name: '灰', code: '#9E9E9E'}
            ];
            
            const total = gameState.gridSize;
            // 1. 先定目标：随机选一个作为正确答案
            const targetColor = colors[Math.floor(Math.random() * colors.length)];
            gameState.currentTarget = targetColor;
            
            document.getElementById('target-display').classList.remove('hidden');
            document.getElementById('target-text').innerHTML = `<span style="color: ${targetColor.code}; font-weight: bold; font-size: 2rem;">${targetColor.name}色</span>`;
            speak("请找出" + targetColor.name + "色");

            // 2. 构造盘面数据（确保目标在盘面内，且只有一个）
            let gridData = [targetColor];
            let availableColors = colors.filter(c => c.code !== targetColor.code);
            while(gridData.length < total) {
                const rand = availableColors[Math.floor(Math.random() * availableColors.length)];
                gridData.push(rand);
            }
            shuffle(gridData);

            // 3. 渲染
            gridData.forEach(color => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.style.backgroundColor = color.code;
                cell.style.border = 'none';
                cell.onclick = () => onColorClick(color, cell);
                document.getElementById('game-grid-container').appendChild(cell);
            });
            gameState.totalToFind = 1;
            updateProgress();
        }

        function onColorClick(color, cellEl) {
            if (!gameState.isPlaying) startTimer();
            if (color.code === gameState.currentTarget.code) {
                gameState.foundCount++;
                cellEl.classList.add('correct');
                updateProgress();
                finishGame(); // 只有一个目标
            } else {
                cellEl.classList.add('error');
                setTimeout(() => cellEl.classList.remove('error'), 400);
            }
        }

        // 6.4 闪忆方格 (纯位置记忆，无数字)
        function initFlash() {
            const total = gameState.gridSize;
            // 闪记逻辑：随机选中一半的格子作为目标
            const targetCount = Math.floor(total / 2) + 1;
            let positions = Array.from({length: total}, (_, i) => i);
            shuffle(positions);
            gameState.flashSequence = positions.slice(0, targetCount);
            gameState.totalToFind = targetCount;
            gameState.foundCount = 0;

            for (let i = 0; i < total; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell flash-cell';
                cell.dataset.index = i;
                cell.onclick = () => onFlashClick(i, cell);
                document.getElementById('game-grid-container').appendChild(cell);
            }

            // 闪示阶段
            let flashIndex = 0;
            const flashInterval = setInterval(() => {
                if (flashIndex >= gameState.flashSequence.length) {
                    clearInterval(flashInterval);
                    setTimeout(() => {
                        document.querySelectorAll('.flash-cell').forEach(c => c.classList.remove('active'));
                        speak("开始还原");
                        gameState.isPlaying = true; // 允许玩家点击
                    }, 500);
                    return;
                }
                const idx = gameState.flashSequence[flashIndex];
                document.querySelectorAll('.flash-cell')[idx].classList.add('active');
                flashIndex++;
            }, 600); // 每个格子闪烁600毫秒
        }

        function onFlashClick(index, cellEl) {
            if (!gameState.isPlaying) return;
            if (gameState.flashSequence.includes(index)) {
                if (!cellEl.classList.contains('selected')) {
                    cellEl.classList.add('selected');
                    gameState.foundCount++;
                    updateProgress();
                    if (gameState.foundCount === gameState.totalToFind) finishGame();
                }
            } else {
                cellEl.classList.add('error');
                setTimeout(() => cellEl.classList.remove('error'), 400);
            }
        }

        // 6.5 色彩识字 (找字，而非颜色)
        function initColorWord() {
            const colors = ['红', '绿', '蓝', '黄', '紫', '橙', '青', '粉', '棕', '黑'];
            const colorCodes = {'红':'#F44336', '绿':'#4CAF50', '蓝':'#2196F3', '黄':'#FFEB3B', '紫':'#9C27B0', '橙':'#FF9800', '青':'#00BCD4', '粉':'#E91E63', '棕':'#795548', '黑':'#000000'};
            
            const total = gameState.gridSize;
            // 1. 先定目标字
            const targetChar = colors[Math.floor(Math.random() * colors.length)];
            gameState.currentTarget = targetChar;
            gameState.totalToFind = 1; // 识字模式一次找这一个

            document.getElementById('target-display').classList.remove('hidden');
            document.getElementById('target-text').innerText = `【${targetChar}】字`;
            speak(`请找出${targetChar}字`);

            // 2. 构造盘面：确保目标字在盘面上
            let gridChars = [targetChar];
            let availableChars = colors.filter(c => c !== targetChar);
            while(gridChars.length < total) {
                gridChars.push(availableChars[Math.floor(Math.random() * availableChars.length)]);
            }
            shuffle(gridChars);

            // 3. 渲染：每个字赋予随机颜色（干扰色）
            gridChars.forEach(char => {
                const randColor = colors[Math.floor(Math.random() * colors.length)];
                const cell = createCell(char, () => onWordClick(char, cell));
                cell.style.color = colorCodes[randColor];
                document.getElementById('game-grid-container').appendChild(cell);
            });
            updateProgress();
        }

        function onWordClick(char, cellEl) {
            if (!gameState.isPlaying) startTimer();
            if (char === gameState.currentTarget) {
                gameState.foundCount++;
                cellEl.classList.add('correct');
                updateProgress();
                finishGame();
            } else {
                cellEl.classList.add('error');
                setTimeout(() => cellEl.classList.remove('error'), 400);
            }
        }

        // 6.6 数字记忆 (语音播报一串数字，玩家按顺序点击)
        function initNumberMem() {
            const total = gameState.gridSize;
            gameState.sequence = Array.from({length: total}, (_, i) => i + 1);
            shuffle(gameState.sequence);
            
            // 渲染网格
            gameState.sequence.forEach(num => {
                const cell = createCell(num.toString(), () => onMemClick(num, cell));
                document.getElementById('game-grid-container').appendChild(cell);
            });

            // 语音播报阶段
            document.getElementById('target-display').classList.remove('hidden');
            document.getElementById('target-text').innerText = "仔细听，记住顺序...";
            
            let i = 0;
            const speakSeq = setInterval(() => {
                if (i >= gameState.sequence.length) {
                    clearInterval(speakSeq);
                    document.getElementById('target-display').classList.add('hidden');
                    speak("请依次点击");
                    gameState.isPlaying = true;
                    return;
                }
                speak(gameState.sequence[i].toString());
                i++;
            }, 1000); // 每秒报一个数
        }

        function onMemClick(val, cellEl) {
            if (!gameState.isPlaying) return;
            if (val === gameState.sequence[gameState.foundCount]) {
                gameState.foundCount++;
                cellEl.classList.add('correct');
                updateProgress();
                if (gameState.foundCount === gameState.totalToFind) finishGame();
            } else {
                cellEl.classList.add('error');
                setTimeout(() => cellEl.classList.remove('error'), 400);
                speak("错了");
            }
        }

        // ================= 7. 游戏结算与升级系统 =================
        function updateProgress() {
            document.getElementById('progress-text').innerText = `${gameState.foundCount}/${gameState.totalToFind}`;
        }

        function createCell(text, onClick) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.innerText = text;
            cell.onclick = onClick;
            return cell;
        }

        function finishGame() {
            clearInterval(gameState.timerInterval);
            gameState.isPlaying = false;
            
            const time = parseFloat(gameState.timer.toFixed(1));
            const mode = gameState.mode;
            
            // 保存成绩
            appData.user.totalGames++;
            appData.user.totalTime += time;
            appData.user.calendar[new Date().toDateString()] = true;
            appData.records[mode].push(time);
            appData.records[mode].sort((a, b) => a - b); // 升序排列
            if (appData.records[mode].length > 10) appData.records[mode].pop(); // 只保留前10名
            
            // 经验值与等级
            const xpGain = Math.max(10, Math.floor(100 - time));
            appData.user.xp += xpGain;
            const nextLevelXp = appData.user.level * 100;
            if (appData.user.xp >= nextLevelXp) {
                appData.user.level++;
                appData.user.xp -= nextLevelXp;
                speak("恭喜升级！");
            }
            saveData();

            // 结算展示
            const isRecord = appData.records[mode][0] === time;
            let msg = `用时：${time} 秒<br>获得经验：${xpGain} XP`;
            if (isRecord) {
                msg += `<br><span class="gold-effect">🏆 恭喜！创造了新的最快纪录！</span>`;
            }
            
            document.getElementById('result-message').innerHTML = msg;
            document.getElementById('result-modal').classList.add('active');
            
            // 胜利语音
            speak(isRecord ? "恭喜，创造了新纪录" : "训练完成");
        }

        function closeModal() {
            document.getElementById('result-modal').classList.remove('active');
            // 自动提升难度
            if (gameState.level < 6) {
                gameState.level++;
            }
            startLevel();
        }

        function quitGame() {
            clearInterval(gameState.timerInterval);
            gameState.isPlaying = false;
            showHome();
        }

        // ================= 8. 备份、恢复与二维码 =================
        function exportJSON() {
            const dataStr = JSON.stringify(appData);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `专注力数据_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importJSON(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    appData = { ...appData, ...imported };
                    saveData();
                    alert("数据恢复成功！");
                    showHome();
                } catch(err) {
                    alert("文件格式错误！");
                }
            };
            reader.readAsText(file);
        }

        function generateShareLink() {
            const dataStr = btoa(encodeURIComponent(JSON.stringify(appData)));
            const textarea = document.getElementById('backup-textarea');
            textarea.value = dataStr;
            
            // 生成二维码
            document.getElementById('qrcode-container').innerHTML = '';
            new QRCode(document.getElementById("qrcode-container"), {
                text: dataStr,
                width: 128,
                height: 128
            });
        }

        function importTextData() {
            const val = document.getElementById('backup-textarea').value.trim();
            if (!val) return;
            try {
                const jsonStr = decodeURIComponent(atob(val));
                const imported = JSON.parse(jsonStr);
                appData = { ...appData, ...imported };
                saveData();
                alert("数据恢复成功！");
                showHome();
            } catch(err) {
                alert("文本无效，无法恢复！");
            }
        }

        function updateRankingUI() {
            const list = document.getElementById('ranking-list');
            list.innerHTML = '';
            const modes = ['schulte', 'hanzi', 'color-interfere', 'flash', 'color-word', 'number-mem'];
            modes.forEach(m => {
                const records = appData.records[m];
                if (records.length > 0) {
                    const div = document.createElement('div');
                    div.style.marginBottom = '15px';
                    div.innerHTML = `<strong>${getModeName(m)}</strong><br>最佳成绩: <span style="color:var(--primary); font-weight:bold;">${records[0]} 秒</span>`;
                    list.appendChild(div);
                }
            });
        }

        // 启动初始化
        window.onload = loadData;
    </script>
</body>
</html>
