<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舒尔特方格专注力训练</title>
    <style>
        :root { --primary: #4CAF50; --primary-hover: #45a049; --active: #2196F3; --bg: #f4f4f9; --card: #ffffff; --text: #333333; --shadow: 0 2px 8px rgba(0,0,0,0.1); --gold: #FFD700; --gold-dark: #B8860B; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; display: flex; flex-direction: column; align-items: center; background: var(--bg); padding: 20px; margin: 0; color: var(--text); }
        
        /* 控制面板 */
        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
        button { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; background: var(--primary); color: white; transition: 0.3s; box-shadow: var(--shadow); }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button.active { background: var(--active); }
        select { padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; cursor: pointer; outline: none; }

        /* 信息栏 */
        .info { font-size: 24px; margin-bottom: 15px; font-weight: bold; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .timer { color: var(--active); }
        .best { font-size: 16px; color: #888; font-weight: normal; }

        /* 方格区域 */
        #grid { display: grid; gap: 5px; max-width: 500px; width: 100%; aspect-ratio: 1/1; margin-bottom: 30px; }
        .cell { display: flex; align-items: center; justify-content: center; background: var(--card); border-radius: 8px; font-size: 24px; font-weight: bold; cursor: pointer; user-select: none; transition: 0.2s; box-shadow: var(--shadow); }
        .cell:hover { background: #e0e0e0; transform: scale(1.05); }
        .cell.correct { background: var(--primary); color: white; pointer-events: none; transform: scale(0.95); }
        .cell.wrong { background: #f44336; color: white; animation: shake 0.3s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

        /* 达标特效 - 金色格子 */
        .cell.golden {
            background: linear-gradient(135deg, #FFD700, #FFA500) !important;
            color: #8B4513 !important;
            border: 2px solid #FFD700;
            animation: goldenPulse 1s infinite;
            pointer-events: none;
        }
        @keyframes goldenPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.9); }
        }

        /* 达标提示横幅 */
        .goal-banner {
            display: none;
            width: 100%;
            max-width: 500px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #8B4513;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            animation: bannerSlide 0.5s ease-out;
        }
        @keyframes bannerSlide {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 打卡日历 */
        .calendar { width: 100%; max-width: 500px; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 30px; }
        .calendar h3 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid var(--bg); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .streak { font-size: 14px; color: #FF9800; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-header { text-align: center; font-size: 12px; color: #888; padding: 5px; }
        .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border-radius: 6px; background: #f0f0f0; color: #888; position: relative; }
        .day.checked { background: var(--primary); color: white; }
        .day.today { border: 2px solid var(--active); }
        .day.checked.today { background: var(--active); }
        .day.checked::after { content: '🔥'; position: absolute; top: -5px; right: -5px; font-size: 10px; }

        /* 历史记录 */
        .history { width: 100%; max-width: 500px; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); }
        .history h3 { margin: 0 0 15px 0; font-size: 18px; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        .record { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .record:last-child { border-bottom: none; }
        .record .mode { color: var(--active); font-weight: bold; }
        .record .goal-badge { color: #FFD700; font-weight: bold; text-shadow: 0 0 3px rgba(255,215,0,0.5); }
        .clear-btn { background: #f44336; font-size: 12px; padding: 5px 10px; margin-left: auto; }

        /* 训练目标说明 */
        .goal-info {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border-left: 4px solid var(--gold);
        }
        .goal-info h4 { margin: 0 0 8px 0; font-size: 15px; color: var(--gold-dark); }
        .goal-info p { margin: 4px 0; font-size: 13px; color: #666; }
        .goal-info .gold-text { color: var(--gold-dark); font-weight: bold; }
    </style>
</head>
<body>

<div class="controls">
    <select id="sizeSelect" onchange="changeSize(this.value)">
        <option value="3">3x3 (入门)</option>
        <option value="4">4x4 (进阶)</option>
        <option value="5" selected>5x5 (标准)</option>
        <option value="6">6x6 (挑战)</option>
        <option value="7">7x7 (极限)</option>
        <option value="9">9x9 (地狱)</option>
    </select>
    <button onclick="initGame('number')" id="btn-number">数字模式</button>
    <button onclick="initGame('hanzi')" id="btn-hanzi">汉字模式</button>
    <button onclick="initGame('color')" id="btn-color">色彩模式</button>
</div>

<div class="info">
    <div>目标: <span id="target">-</span></div>
    <div class="timer">⏱️ <span id="timer">0.0</span>s</div>
    <div class="best" id="bestRecord">🏆 最佳: -</div>
</div>

<div id="grid"></div>

<!-- 达标提示横幅 -->
<div class="goal-banner" id="goalBanner">
    🎉 恭喜达成训练目标！所有格子已变为金色！
</div>

<!-- 训练目标说明 -->
<div class="goal-info">
    <h4>🎯 训练目标（达标即金色特效）</h4>
    <p>• 5x5 数字模式：≤ <span class="gold-text">30秒</span> → 格子变金色</p>
    <p>• 5x5 汉字模式：≤ <span class="gold-text">40秒</span> → 格子变金色</p>
    <p>• 5x5 色彩模式：≤ <span class="gold-text">45秒</span> → 格子变金色</p>
    <p>• 其他尺寸：标准时间 × 0.8 倍为达标线</p>
</div>

<!-- 打卡日历 -->
<div class="calendar">
    <h3>
        📅 训练打卡日历 
        <span class="streak" id="streakDisplay">🔥 连续打卡: 0天</span>
    </h3>
    <div class="calendar-grid" id="calendarGrid"></div>
</div>

<!-- 历史记录 -->
<div class="history">
    <h3>📊 最近训练记录 <button class="clear-btn" onclick="clearHistory()">清空</button></h3>
    <div id="historyList"><div style="color:#aaa; text-align:center; padding:20px;">暂无记录，快去训练吧！</div></div>
</div>

<script>
    // --- 配置 ---
    let currentMode = 'number';
    let gridSize = 5;
    let targetIndex = 1;
    let timerInterval = null;
    let startTime = 0;
    let isPlaying = false;
    let colorSubMode = 'char';
    let goalAchieved = false; // 是否达成训练目标

    // 训练目标时间（秒），5x5 标准
    const goalTimes = {
        'number': 30,
        'hanzi': 40,
        'color': 45
    };

    // 汉字库
    const hanziList = "天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏闰余成岁律吕调阳云腾致雨露结为霜金生丽水玉出昆冈剑号巨阙珠称夜光果珍李柰菜重芥姜海咸河淡鳞潜羽翔龙师火帝鸟官人皇始制文字乃服衣裳推位让国有虞陶唐吊民伐罪周发殷汤坐朝问道垂拱平章爱育黎首臣伏戎羌遐迩一体率宾归王".split('');
    
    // 色彩库
    const colorList = [
        {name: "红", hex: "#f44336"}, {name: "蓝", hex: "#2196F3"}, {name: "绿", hex: "#4CAF50"}, 
        {name: "黄", hex: "#FFEB3B"}, {name: "紫", hex: "#9C27B0"}, {name: "橙", hex: "#FF9800"}, 
        {name: "粉", hex: "#E91E63"}, {name: "青", hex: "#00BCD4"}, {name: "棕", hex: "#795548"}
    ];

    // --- 核心逻辑 ---
    function initGame(mode) {
        currentMode = mode;
        targetIndex = 1;
        isPlaying = false;
        goalAchieved = false;
        clearInterval(timerInterval);
        document.getElementById('timer').innerText = "0.0";
        document.getElementById('goalBanner').style.display = 'none';
        
        document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${mode}`).classList.add('active');

        updateBestRecord();
        generateGrid();
    }

    function changeSize(size) {
        gridSize = parseInt(size);
        initGame(currentMode);
    }

    function generateGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
        
        let items = [];
        const totalCells = gridSize * gridSize;

        if (currentMode === 'number') {
            items = Array.from({length: totalCells}, (_, i) => i + 1);
        } else if (currentMode === 'hanzi') {
            const needed = Math.ceil(totalCells / hanziList.length);
            const pool = hanziList.join('').repeat(needed).split('');
            items = pool.sort(() => Math.random() - 0.5).slice(0, totalCells);
        } else if (currentMode === 'color') {
            colorSubMode = Math.random() > 0.5 ? 'char' : 'color';
            const needed = Math.ceil(totalCells / colorList.length);
            const pool = [];
            for(let i=0; i<needed; i++) pool.push(...colorList);
            items = pool.sort(() => Math.random() - 0.5).slice(0, totalCells);
        }
        
        items.sort(() => Math.random() - 0.5);

        items.forEach(item => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            if (currentMode === 'number') {
                cell.innerText = item;
                cell.dataset.value = item;
            } else if (currentMode === 'hanzi') {
                cell.innerText = item;
                cell.dataset.value = item;
            } else if (currentMode === 'color') {
                cell.innerText = item.name;
                cell.style.color = colorList[Math.floor(Math.random() * colorList.length)].hex;
                cell.dataset.char = item.name;
                cell.dataset.color = cell.style.color;
            }
            
            cell.onclick = () => handleClick(cell);
            grid.appendChild(cell);
        });

        updateTarget();
    }

    function handleClick(cell) {
        if (cell.classList.contains('correct') || cell.classList.contains('golden')) return;

        if (!isPlaying) {
            isPlaying = true;
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                document.getElementById('timer').innerText = elapsed;
            }, 100);
        }

        let isCorrect = false;
        if (currentMode === 'color') {
            if (colorSubMode === 'char') {
                isCorrect = (cell.dataset.char == getTargetValue());
            } else {
                isCorrect = (cell.dataset.color == getTargetValue());
            }
        } else {
            isCorrect = (cell.dataset.value == getTargetValue());
        }

        if (isCorrect) {
            cell.classList.add('correct');
            targetIndex++;
            if (targetIndex > gridSize * gridSize) {
                finishGame();
            } else {
                updateTarget();
            }
        } else {
            cell.classList.add('wrong');
            setTimeout(() => cell.classList.remove('wrong'), 300);
        }
    }

    function finishGame() {
        clearInterval(timerInterval);
        const finalTime = parseFloat(document.getElementById('timer').innerText);
        let modeName = '';
        if (currentMode === 'number') modeName = '数字';
        else if (currentMode === 'hanzi') modeName = '汉字';
        else modeName = colorSubMode === 'char' ? '色彩(按字)' : '色彩(按色)';
        
        // 判断是否达成训练目标
        const standardGoal = goalTimes[currentMode] || 30;
        // 根据网格大小调整目标时间：每增大一档，时间乘以1.5倍
        const sizeMultiplier = Math.pow(1.5, gridSize - 5);
        const goalTime = Math.round(standardGoal * sizeMultiplier);
        const achieved = finalTime <= goalTime;
        goalAchieved = achieved;

        // 如果达成目标，所有格子变金色
        if (achieved) {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('correct');
                cell.classList.add('golden');
            });
            document.getElementById('goalBanner').style.display = 'block';
        }

        saveRecord(modeName, gridSize, finalTime, achieved);
        updateBestRecord();
        checkInToday();
        
        let msg = `🎉 恭喜完成！\n模式: ${modeName} ${gridSize}x${gridSize}\n用时: ${finalTime}s`;
        if (achieved) {
            msg += `\n🏆 达成训练目标！格子已变为金色！`;
        }
        alert(msg);
    }

    function getTargetValue() {
        if (currentMode === 'number') return targetIndex;
        if (currentMode === 'hanzi') return hanziList[(targetIndex - 1) % hanziList.length];
        if (currentMode === 'color') {
            const c = colorList[(targetIndex - 1) % colorList.length];
            return colorSubMode === 'char' ? c.name : c.hex;
        }
    }

    function updateTarget() {
        const targetEl = document.getElementById('target');
        if (currentMode === 'color') {
            const c = colorList[(targetIndex-1) % colorList.length];
            if (colorSubMode === 'char') {
                targetEl.innerHTML = `<span style="color:${c.hex}">${c.name}</span>`;
            } else {
                targetEl.innerHTML = `<span style="color:${c.hex}; border-bottom: 3px solid ${c.hex}">找这个颜色</span>`;
            }
        } else {
            targetEl.innerText = getTargetValue();
        }
    }

    // --- 打卡日历逻辑 ---
    function getCheckInData() {
        return JSON.parse(localStorage.getItem('schulte_checkins') || '{}');
    }

    function checkInToday() {
        const today = new Date().toISOString().split('T')[0];
        const data = getCheckInData();
        data[today] = true;
        localStorage.setItem('schulte_checkins', JSON.stringify(data));
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        
        ['日', '一', '二', '三', '四', '五', '六'].forEach(d => {
            const div = document.createElement('div');
            div.className = 'day-header';
            div.innerText = d;
            grid.appendChild(div);
        });

        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const checkInData = getCheckInData();
        const todayStr = today.toISOString().split('T')[0];

        for(let i = 0; i < firstDay; i++) {
            const div = document.createElement('div');
            div.className = 'day';
            grid.appendChild(div);
        }

        for(let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const div = document.createElement('div');
            div.className = 'day';
            div.innerText = d;
            
            if (checkInData[dateStr]) {
                div.classList.add('checked');
            }
            
            if (dateStr === todayStr) div.classList.add('today');
            
            grid.appendChild(div);
        }

        let streak = 0;
        let checkDate = new Date();
        while(true) {
            const dateStr = checkDate.toISOString().split('T')[0];
            if (checkInData[dateStr]) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            } else {
                break;
            }
        }

        document.getElementById('streakDisplay').innerText = `🔥 连续打卡: ${streak}天`;
    }

    // --- 本地存储逻辑 ---
    function getStorageKey() {
        return `schulte_${currentMode}_${gridSize}`;
    }

    function saveRecord(mode, size, time, achieved) {
        const key = `schulte_${mode}_${size}`;
        const history = JSON.parse(localStorage.getItem(key) || '[]');
        
        history.unshift({
            time: time,
            date: new Date().toLocaleString('zh-CN', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}),
            achieved: achieved || false
        });
        
        if (history.length > 10) history.pop();
        
        localStorage.setItem(key, JSON.stringify(history));
        renderHistory();
    }

    function updateBestRecord() {
        const key = getStorageKey();
        const history = JSON.parse(localStorage.getItem(key) || '[]');
        const bestEl = document.getElementById('bestRecord');
        
        if (history.length > 0) {
            const best = Math.min(...history.map(h => h.time));
            bestEl.innerText = `🏆 最佳: ${best}s`;
        } else {
            bestEl.innerText = `🏆 最佳: -`;
        }
        renderHistory();
    }

    function renderHistory() {
        const key = getStorageKey();
        const history = JSON.parse(localStorage.getItem(key) || '[]');
        const listEl = document.getElementById('historyList');
        
        if (history.length === 0) {
            listEl.innerHTML = `<div style="color:#aaa; text-align:center; padding:20px;">暂无记录，快去训练吧！</div>`;
            return;
        }

        listEl.innerHTML = history.map(h => `
            <div class="record">
                <span class="mode">${h.date}</span>
                <span>${h.achieved ? '<span class="goal-badge">🏆 达标!</span> ' : ''}⏱️ ${h.time}s</span>
            </div>
        `).join('');
    }

    function clearHistory() {
        if(confirm('确定要清空当前模式的所有记录吗？')) {
            localStorage.removeItem(getStorageKey());
            updateBestRecord();
        }
    }

    // 初始化
    initGame('number');
    renderCalendar();
</script>
</body>
</html>
